name: Build & Deploy

on:
  push:
    branches: ["main"]
  # A pull request builds the image and pushes only its commit tag (never "latest", never a deploy), so a change can be checked before it is merged.
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One run per branch. A newer pull request build replaces an older one; a deploy on main is never cut off halfway.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/dragonminez/dragonminez-web

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          # Pull requests from forks get no registry access.
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          # Every build is tagged with its commit; only main moves "latest".
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.IMAGE) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Only public values are baked in; secrets are read at runtime from the VPS.
          build-args: |
            PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.PUBLIC_CLERK_PUBLISHABLE_KEY }}
            PUBLIC_APP_URL=${{ secrets.PUBLIC_APP_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to the VPS
    needs: build
    # Only main deploys. The "production" environment (Settings, Environments) holds the deploy key and is limited to main.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy over SSH
        env:
          DMZ_VPS_HOST: ${{ vars.DMZ_VPS_HOST }}
          DMZ_VPS_PORT: ${{ vars.DMZ_VPS_PORT }}
          WEB_DEPLOY_KEY: ${{ secrets.WEB_DEPLOY_KEY }}
          DMZ_VPS_KNOWN_HOSTS: ${{ secrets.DMZ_VPS_KNOWN_HOSTS }}
        run: |
          : "${DMZ_VPS_HOST:?DMZ_VPS_HOST variable is required}"
          : "${WEB_DEPLOY_KEY:?WEB_DEPLOY_KEY secret is required (environment production)}"
          : "${DMZ_VPS_KNOWN_HOSTS:?DMZ_VPS_KNOWN_HOSTS secret is required}"
          port="${DMZ_VPS_PORT:-22}"
          if [[ ! "$port" =~ ^[0-9]+$ ]]; then
            echo "::error::DMZ_VPS_PORT must be numeric."
            exit 1
          fi
          if [[ ! "$DMZ_VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::DMZ_VPS_HOST must be a DNS name or IPv4 address without a protocol."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          echo "$WEB_DEPLOY_KEY" > ~/.ssh/web_deploy_key
          chmod 600 ~/.ssh/web_deploy_key
          echo "$DMZ_VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # The key is locked to one command on the server (deploy/vps-deploy.sh); the word after the host is ignored.
          ssh -i ~/.ssh/web_deploy_key -p "$port" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes dmzweb@"$DMZ_VPS_HOST" deploy
