name: Build & Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/dragonminez/dragonminez-web
  # Optional: the "Deploy Webhook" URL of the Dokploy compose app (see docs/deploy.md).
  DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          # Every build is tagged with its commit; only main moves "latest".
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.IMAGE) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Only public values are baked in; secrets are read at runtime from Dokploy.
          build-args: |
            PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.PUBLIC_CLERK_PUBLISHABLE_KEY }}
            PUBLIC_APP_URL=${{ secrets.PUBLIC_APP_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy redeploy
        if: ${{ github.ref == 'refs/heads/main' && env.DOKPLOY_WEBHOOK_URL != '' }}
        run: |
          status=$(curl -sS -o dokploy.txt -w '%{http_code}' -X POST "$DOKPLOY_WEBHOOK_URL"             -H 'Content-Type: application/json' -H 'X-GitHub-Event: push'             --data-binary @"$GITHUB_EVENT_PATH")
          cat dokploy.txt; echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Dokploy answered $status. Check that Autodeploy is on for the website app and that its branch is main."
            exit 1
          fi
