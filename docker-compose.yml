# The website on the VPS: plain Docker Compose behind the Traefik that already runs there (it also serves the wiki).
# GitHub Actions connects over SSH and runs deploy/vps-deploy.sh, which fetches this file from main, pulls the image
# the build pushed to GHCR and restarts the container. Secrets live in /opt/dragonminez-web/.env on the VPS, never in git.
# Setup, cutover and rollback: docs/deploy.md.
name: dragonminez-web

services:
  web:
    # WEB_IMAGE pins a specific build (a commit sha tag) for rollbacks and tests; unset, it follows main.
    image: ${WEB_IMAGE:-ghcr.io/dragonminez/dragonminez-web:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in /opt/dragonminez-web/.env}
      PUBLIC_CLERK_PUBLISHABLE_KEY: ${PUBLIC_CLERK_PUBLISHABLE_KEY:?set PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY}
      CLERK_WEBHOOK_SIGNING_SECRET: ${CLERK_WEBHOOK_SIGNING_SECRET:?set CLERK_WEBHOOK_SIGNING_SECRET}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?set PUBLIC_APP_URL}
      # Discord: staff of the forum and moderation of the HairSalon.
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-1216429657273012415}
      DISCORD_MODERATOR_ROLES: ${DISCORD_MODERATOR_ROLES:-Moderator}
      ADMIN_DISCORD_IDS: ${ADMIN_DISCORD_IDS:-}
      # The forum is staff-only until this is exactly 1.
      FORUM_PUBLIC: ${FORUM_PUBLIC:-}
    # The Postgres installed on the host (the bot's) is reached through its Unix socket: no open port, no firewall rule.
    # DATABASE_URL then looks like postgresql://user:pass@localhost/db?host=/var/run/postgresql
    volumes:
      - /var/run/postgresql:/var/run/postgresql
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4321/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # Traefik (the one Dokploy installed) finds this container through these labels: same host, entry points and
    # certificate resolver as the old Dokploy route. WEB_TRAEFIK=false lets a first start run without taking real traffic.
    labels:
      traefik.enable: "${WEB_TRAEFIK:-true}"
      traefik.docker.network: dokploy-network
      traefik.http.routers.dmzweb-http.rule: Host(`dragonminez.com`)
      traefik.http.routers.dmzweb-http.entrypoints: web
      traefik.http.routers.dmzweb-http.middlewares: dmzweb-https
      traefik.http.middlewares.dmzweb-https.redirectscheme.scheme: https
      traefik.http.middlewares.dmzweb-https.redirectscheme.permanent: "true"
      traefik.http.routers.dmzweb.rule: Host(`dragonminez.com`)
      traefik.http.routers.dmzweb.entrypoints: websecure
      traefik.http.routers.dmzweb.tls.certresolver: letsencrypt
      traefik.http.routers.dmzweb.service: dmzweb
      traefik.http.services.dmzweb.loadbalancer.server.port: "4321"
    # The Postgres service and Traefik live on this network.
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
